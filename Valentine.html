<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffe6eb;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #d6336c;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      width: 300px;
      height: 200px;
    }

    button {
      font-size: 1.2rem;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn {
      background-color: #51cf66;
      color: white;
      left: 50px;
      top: 80px;
    }

    #noBtn {
      background-color: #ff6b6b;
      color: white;
      left: 180px;
      top: 80px;
    }

    #gif {
      margin-top: 30px;
      display: none;
    }
  </style>
</head>
<body>

  <h1> Be My Valentine this 14th Feb because I'm the '1' 4 You 💖</h1>

  <div class="buttons">
    <button id="yesBtn">Fuck Yes!</button>
    <button id="noBtn">No way, bye </button>
  </div>

  <div id="gif">
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" alt="Love GIF" width="300">
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const gif = document.getElementById("gif");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 220;
      const y = Math.random() * 150;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      gif.style.display = "block";
    });
  </script>

</body>
</html>
