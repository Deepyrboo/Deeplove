<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 30px;
      text-shadow: 2px 2px #ff4d6d;
    }

    button {
      font-size: 1.4rem;
      padding: 15px 35px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.1s;
    }

    #yesBtn {
      background: #38d9a9;
      color: #fff;
      left: 50%;
      transform: translateX(-50%);
      bottom: 120px;
    }

    #noBtn {
      background: #ff6b6b;
      color: #fff;
      left: 50%;
      transform: translateX(-50%);
      bottom: 40px;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    #result h2 {
      color: #fff;
      margin-bottom: 15px;
    }

    img {
      width: 280px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Be my Valentine on 14 Feb, because I am the 1 4 You 💘</h1>

    <button id="yesBtn">Feck YES! 💖</button>
    <button id="noBtn">NO, Bye 🙄</button>

    <div id="result">
      <h2>I knew it 😌💞</h2>
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Love GIF">
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    function moveButton() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Works on phones (tap)
    noBtn.addEventListener("touchstart", moveButton);
    noBtn.addEventListener("mouseover", moveButton);

    yesBtn.addEventListener("click", () => {
      result.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
